# ===================================================================
# AgriSathi Backend Configuration
# Environment variables are loaded automatically from .env
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=agrisathi-backend

# CORS Configuration (Only http://localhost:3000 allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Database Datasource Configuration (Configured with DataSourceConfig & safe H2 fallback)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:agrisathidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration (Spring Boot 3.3.x)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.open-in-view=false

# Multipart File Upload Configuration (For Crop & Disease Scans)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT Security Configuration
jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RrZXlhZ3Jpc2F0aGlhaXN1cGVyc2VjcmV0a2V5MTIzNDU2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Cloudinary Storage Integration Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Logging Configuration
logging.level.com.agrisathi.api=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
