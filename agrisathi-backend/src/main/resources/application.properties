# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=agrisathi-backend

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrisathidb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
jwt.expiration-ms=1800000

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:1234567890}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Logging Configuration
logging.level.com.agrisathi.api=DEBUG
logging.level.org.springframework.security=INFO
