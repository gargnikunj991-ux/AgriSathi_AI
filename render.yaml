services:
  - type: web
    name: agrisathi-backend
    runtime: docker
    rootDir: agrisathi-backend
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "1"
      - key: DDL_AUTO
        value: update
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app"
      - key: PORT
        value: "8080"
      - key: LOG_LEVEL_APP
        value: INFO
      - key: LOG_LEVEL_SECURITY
        value: INFO
